<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Easy Villager Enchantment Archive workflow</title>
  <desc id="desc">Store villagers, browse book trades, reroll fresh librarians, and preserve the archive.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#172434"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#05090e" flood-opacity=".42"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#68d391"/></marker>
  </defs>
  <rect width="1200" height="520" rx="22" fill="url(#bg)"/>
  <text x="62" y="72" fill="#f7fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="34" font-weight="700">One Library for every librarian book</text>
  <text x="62" y="108" fill="#a9b8c7" font-family="system-ui,Segoe UI,sans-serif" font-size="19">Archive villagers, compare real trades, buy directly, and reroll eligible librarians.</text>
  <path d="M275 265 H355 M565 265 H645 M855 265 H935" stroke="#68d391" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="60" y="166" width="215" height="226" rx="18" fill="#21354a" stroke="#4d759f" stroke-width="2"/>
    <rect x="80" y="190" width="48" height="48" rx="10" fill="#386f61"/>
    <path d="M94 218h20M104 208v20" stroke="#d8ffe6" stroke-width="4" stroke-linecap="round"/>
    <text x="80" y="278" fill="#f7fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="23" font-weight="700">Store villagers</text>
    <text x="80" y="310" fill="#bcd0df" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Expandable archive</text>
    <text x="80" y="337" fill="#bcd0df" font-family="system-ui,Segoe UI,sans-serif" font-size="16">with page navigation</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="355" y="166" width="210" height="226" rx="18" fill="#403856" stroke="#8772b5" stroke-width="2"/>
    <rect x="375" y="190" width="48" height="48" rx="10" fill="#6855a1"/>
    <path d="M387 202h24v27h-24zM391 207h16M391 214h16" stroke="#f4edff" stroke-width="3" fill="none"/>
    <text x="375" y="278" fill="#f7fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="23" font-weight="700">Browse trades</text>
    <text x="375" y="310" fill="#d6caed" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Search books and compare</text>
    <text x="375" y="337" fill="#d6caed" font-family="system-ui,Segoe UI,sans-serif" font-size="16">prices and availability</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="645" y="166" width="210" height="226" rx="18" fill="#4a3a27" stroke="#b18a4c" stroke-width="2"/>
    <rect x="665" y="190" width="48" height="48" rx="10" fill="#b38439"/>
    <path d="M678 214a12 12 0 1 0 8-11M686 201l1 9 9-2" stroke="#fff4d5" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="665" y="278" fill="#f7fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="23" font-weight="700">Reroll safely</text>
    <text x="665" y="310" fill="#ead7b3" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Roll once or auto-find</text>
    <text x="665" y="337" fill="#ead7b3" font-family="system-ui,Segoe UI,sans-serif" font-size="16">a selected enchantment</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="935" y="166" width="205" height="226" rx="18" fill="#25423c" stroke="#559684" stroke-width="2"/>
    <rect x="955" y="190" width="48" height="48" rx="10" fill="#3c8b78"/>
    <path d="M970 205h18v24h-18zM974 205v-5h10v5M974 215h10" stroke="#e3fff7" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="955" y="278" fill="#f7fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="23" font-weight="700">Keep progress</text>
    <text x="955" y="310" fill="#c0e6dc" font-family="system-ui,Segoe UI,sans-serif" font-size="16">Offers, stock and XP</text>
    <text x="955" y="337" fill="#c0e6dc" font-family="system-ui,Segoe UI,sans-serif" font-size="16">stay with the archive</text>
  </g>
  <text x="62" y="466" fill="#68d391" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">Minecraft 1.21.1 · NeoForge · Easy Villagers required · JEI optional</text>
</svg>
